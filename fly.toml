app = "claude-puddle"
primary_region = "ord"

[build]

[env]
  DB_PATH = "/data/db.sqlite3"
  CONTEXT_DIR = "/data/context"

[mounts]
  source = "claude_puddle_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"
